<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentBridge — Observability Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 6px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .accent { color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--text); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; min-width: 240px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 9px 12px; font-size: 14px;
  }
  button {
    background: var(--accent); color: #0d1117; border: 0; border-radius: 6px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .trace { margin-top: 12px; }
  .run { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; font-size: 13px; }
  .run .prompt { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.bad { background: rgba(248,81,73,.15); color: var(--bad); }
  .answer { margin-top: 6px; }
  .meta { color: var(--muted); margin-top: 4px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
  <h1>AgentBridge</h1>
  <div class="sub">Agentic-AI Pilot-to-Production Accelerator — live observability dashboard</div>

  <div class="grid">
    <div class="card"><div class="label">Total runs</div><div class="value accent" id="total_runs">–</div></div>
    <div class="card"><div class="label">Blocked runs</div><div class="value bad" id="blocked_runs">–</div></div>
    <div class="card"><div class="label">Latency p50 (ms)</div><div class="value" id="p50">–</div></div>
    <div class="card"><div class="label">Latency p95 (ms)</div><div class="value" id="p95">–</div></div>
    <div class="card"><div class="label">Latency max (ms)</div><div class="value" id="max">–</div></div>
  </div>

  <div class="panel">
    <h2>Tool usage &amp; guardrail events</h2>
    <table id="usage_table">
      <thead><tr><th>Type</th><th>Name</th><th>Count</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="usage_empty">No tool or guardrail activity yet.</div>
  </div>

  <div class="panel">
    <h2>Invoke the agent</h2>
    <form id="invoke_form">
      <input type="text" id="prompt" placeholder='Try: "What is 125 * 8?"' autocomplete="off">
      <label class="checkbox"><input type="checkbox" id="hitl"> HITL approve (allows calculator)</label>
      <button type="submit" id="run_btn">Run</button>
    </form>
    <div class="trace" id="trace"><div class="empty">Runs will appear here.</div></div>
  </div>

<script>
const fmt = v => (v === null || v === undefined) ? '–' : v;

async function refreshMetrics() {
  try {
    const m = await (await fetch('/metrics')).json();
    document.getElementById('total_runs').textContent = fmt(m.total_runs);
    document.getElementById('blocked_runs').textContent = fmt(m.blocked_runs);
    document.getElementById('p50').textContent = fmt(m.latency_ms?.p50);
    document.getElementById('p95').textContent = fmt(m.latency_ms?.p95);
    document.getElementById('max').textContent = fmt(m.latency_ms?.max);

    const rows = [];
    for (const [name, count] of Object.entries(m.tool_usage || {})) rows.push(['tool', name, count]);
    for (const [name, count] of Object.entries(m.guardrail_events || {})) rows.push(['guardrail', name, count]);
    const tbody = document.querySelector('#usage_table tbody');
    tbody.innerHTML = rows.map(([t, n, c]) =>
      `<tr><td>${t}</td><td>${n}</td><td>${c}</td></tr>`).join('');
    document.getElementById('usage_empty').style.display = rows.length ? 'none' : 'block';
  } catch (e) { /* server briefly down during restart */ }
}

const traceEl = document.getElementById('trace');
document.getElementById('invoke_form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const hitl = document.getElementById('hitl').checked;
  const btn = document.getElementById('run_btn');
  btn.disabled = true; btn.textContent = 'Running…';
  try {
    const r = await (await fetch('/invoke', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ prompt, hitl })
    })).json();
    const blocked = r.blocked ? '<span class="badge bad">BLOCKED</span>' : '<span class="badge ok">OK</span>';
    const div = document.createElement('div');
    div.className = 'run';
    div.innerHTML = `<div class="prompt">“${prompt}”${blocked}</div>
      <div class="answer">${r.answer}</div>
      <div class="meta">iterations: ${r.iterations}</div>`;
    if (traceEl.querySelector('.empty')) traceEl.innerHTML = '';
    traceEl.prepend(div);
  } catch (err) {
    alert('Request failed: ' + err);
  } finally {
    btn.disabled = false; btn.textContent = 'Run';
    refreshMetrics();
  }
});

refreshMetrics();
setInterval(refreshMetrics, 2500);
</script>
</body>
</html>
